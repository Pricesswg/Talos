[project]
name = "talos-core"
version = "0.1.0"
description = "Data provenance and offline-autonomy mapping for Home Assistant — standalone core"
requires-python = ">=3.12"
license = { text = "MIT" }
readme = "README.md"
authors = [{ name = "Alessandro Simonitto" }]
dependencies = []

[project.optional-dependencies]
# Only the standalone CLI needs a network client; the core itself stays bare.
cli = ["aiohttp>=3.9"]

[project.scripts]
talos = "talos_core.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["talos_core", "talos_core.sources", "talos_core.observed"]

[tool.setuptools.package-data]
talos_core = ["data/*.json"]

[tool.ruff]
line-length = 100
target-version = "py312"
